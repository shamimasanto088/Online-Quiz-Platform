<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Secure Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b1329] text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">
    <div class="w-full max-w-md bg-slate-900/60 border border-slate-800 backdrop-blur-md rounded-xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-cyan-400 font-mono tracking-wider">&gt;_ SIGNUP_SHELL</h2>
            <p class="text-slate-400 text-sm mt-1">Initialize access credentials...</p>
        </div>

        <!-- Notification alerts (e.g. passwords don't match) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="p-3 mb-4 rounded text-sm bg-red-950/40 border border-red-500/30 text-red-400">
                        {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Registration Form -->
        <form method="POST">
            <div class="mb-4">
                <label class="block text-slate-300 text-xs font-mono mb-2">NEW USERNAME:</label>
                <input type="text" name="username" class="w-full bg-[#070b18] border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" required>
            </div>
            <div class="mb-4">
                <label class="block text-slate-300 text-xs font-mono mb-2">PASSPHRASE:</label>
                <input type="password" name="password" class="w-full bg-[#070b18] border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" required>
            </div>
            <div class="mb-6">
                <label class="block text-slate-300 text-xs font-mono mb-2">CONFIRM PASSPHRASE:</label>
                <input type="password" name="confirm_password" class="w-full bg-[#070b18] border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono" required>
            </div>
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-mono text-sm py-2 rounded transition-all shadow-lg shadow-cyan-500/10">
                Register Credentials
            </button>
        </form>
        <div class="text-center mt-6 pt-4 border-t border-slate-800 text-xs font-mono text-slate-400">
            Already have a key? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:underline">Access Terminal</a>
        </div>
    </div>
</body>
</html>
